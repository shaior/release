workflow:
  as: telcov10n-functional-cnf-ran-arm-ibx
  documentation: |-
    ARM IBX seed deployment for CNF RAN testing on kni-qe-133 and helix95.
    Deploy the hub, mirror operators and multi architecture OCP images,
    configure MinIO, then deploy the seed spoke from the ZTP paths in job config.
    Leave the seed spoke managed by ACM and its ArgoCD applications in place
    for verification before proceeding to seed image generation.
  steps:
    pre:
    # Hub setup — kni-qe-133 deployed at VERSION.
    - ref: telcov10n-functional-cnf-ran-hub-deploy
    - ref: telcov10n-functional-cnf-ran-hub-config
    - ref: telcov10n-functional-cnf-ran-mirror-spoke-operators
    - ref: telcov10n-functional-cnf-ran-mirror-ocp-arch

    - ref: telcov10n-functional-cnf-ran-ibu-target-deploy-minio
    # Seed deployment. Paths are provided by the job config.
    - ref: telcov10n-functional-cnf-ran-arm-ibx-deploy-spoke-sno
    - ref: telcov10n-functional-cnf-ran-prune
